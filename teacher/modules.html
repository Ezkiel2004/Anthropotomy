<script>
'use strict';

const user = Auth.requireAuthSync('teacher');

// ── State ─────────────────────────────────────────────────────
// Modules arrive in body-system order, then module order. Archived ones stay out of "All".
let allModules = [];
let allSystems = [];
const filters = { status: 'all', system: '', query: '' };
const STATUS_FILTERS = [['all', 'All'], ['published', 'Published'], ['draft', 'Draft'], ['archived', 'Archived']];
const count = (n, word, many = word + 's') => `${n} ${n === 1 ? word : many}`;
const moduleById = id => allModules.find(m => m.module_id === id);
const liveModules = () => allModules.filter(m => m.status !== 'archived');

// ── Load modules from API ─────────────────────────────────────
async function loadModules() {
  const grid = document.getElementById('moduleGrid');
  if (!allModules.length) grid.innerHTML = '<div class="cs-empty" role="status"><p>Loading modules…</p></div>';
  try {
    const [modsData, sysData] = await Promise.all([
      fetch(`${API_BASE}/modules.php`, { credentials: 'same-origin' }).then(r => r.json()),
      allSystems.length ? null : fetch(`${API_BASE}/body-systems.php`, { credentials: 'same-origin' }).then(r => r.json()),
    ]);
    if (!modsData.success) throw new Error(modsData.message || 'Modules did not load.');
    allModules = modsData.data || [];
    if (sysData?.success) allSystems = sysData.data || [];
    renderSummary();
    renderFilters();
    renderModules();
    if (openModuleId !== null) {
      const open = moduleById(openModuleId);
      if (open) { ModuleWorkspace.update(open); document.title = `${open.title} | Anthropotomy`; }
      else { history.replaceState(null, '', 'modules.html'); showGrid(); }
    }
    return true;
  } catch (err) {
    console.error(err);
    grid.innerHTML = '<div class="cs-empty" role="alert"><p>Modules could not load. Check that XAMPP is running, then reload the page.</p></div>';
    return false;
  }
}

// ── Summary and filters ───────────────────────────────────────
function renderSummary() {
  const live = liveModules();
  const stat = (id, n, word, many) => {
    const number = document.getElementById(id);
    number.textContent = n;
    number.nextElementSibling.textContent = n === 1 ? word : many;
  };
  stat('sumModules', live.length, 'module', 'modules');
  stat('sumLessons', live.reduce((sum, m) => sum + (m.lessons || []).length, 0), 'lesson', 'lessons');
  stat('sumPublished', live.filter(m => m.status === 'published').length, 'published', 'published');
  stat('sumDraft', live.filter(m => m.status === 'draft').length, 'draft', 'drafts');
}

function renderFilters() {
  const live = liveModules();
  const counts = {
    all: live.length,
    published: live.filter(m => m.status === 'published').length,
    draft: live.filter(m => m.status === 'draft').length,
    archived: allModules.length - live.length,
  };
  if (filters.status === 'archived' && !counts.archived) filters.status = 'all';
  document.getElementById('statusFilter').innerHTML = STATUS_FILTERS
    .filter(([key]) => key !== 'archived' || counts.archived)
    .map(([key, label]) => `<button type="button" data-status="${key}" aria-pressed="${filters.status === key}">${label} <em class="cs-num">${counts[key]}</em></button>`)
    .join('');

  const systems = new Map(allModules.map(m => [String(m.system_id), m.system_name]));
  if (!systems.has(filters.system)) filters.system = '';
  const select = document.getElementById('systemFilter');
  select.innerHTML = '<option value="">All body systems</option>'
    + [...systems].map(([id, name]) => `<option value="${id}">${escHtml(name)}</option>`).join('');
  select.value = filters.system;
}

function matches(m) {
  if (filters.status === 'all' ? m.status === 'archived' : m.status !== filters.status) return false;
  if (filters.system && String(m.system_id) !== filters.system) return false;
  if (!filters.query) return true;
  return [m.title, m.description, m.system_name, ...(m.lessons || []).map(l => l.title)]
    .some(text => String(text || '').toLowerCase().includes(filters.query));
}

function clearFilters() {
  Object.assign(filters, { status: 'all', system: '', query: '' });
  document.getElementById('moduleSearch').value = '';
  document.getElementById('systemFilter').value = '';
  document.querySelectorAll('#statusFilter [data-status]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.status === 'all')));
  renderModules();
}

// ── Module cards ──────────────────────────────────────────────
function renderModules() {
  const grid = document.getElementById('moduleGrid');
  const focusedMore = document.activeElement?.closest?.('#moduleGrid [data-more]')?.dataset.more;
  const shown = allModules.filter(matches);
  if (!allModules.length) {
    grid.innerHTML = '<div class="cs-empty"><p>No modules yet. Make one for a body system, then add its lessons.</p><button type="button" class="cs-btn cs-btn--sm" data-new-module>New module</button></div>';
  } else if (!shown.length) {
    grid.innerHTML = '<div class="cs-empty"><p>No modules match these filters.</p><button type="button" class="cs-btn cs-btn--sm" data-clear-filters>Clear filters</button></div>';
  } else {
    grid.innerHTML = shown.map(moduleCard).join('');
  }
  document.getElementById('moduleResults').textContent = count(shown.length, 'module') + ' shown';
  if (focusedMore) grid.querySelector(`[data-more="${focusedMore}"]`)?.focus({ preventScroll: true });
}

function moduleCard(m) {
  const look = ContentFormat.systemLook(m.system_code);
  const status = ['published', 'draft', 'archived'].includes(m.status) ? m.status : 'draft';
  const lessons = m.lessons || [];
  // Students see a published module only once it has a published lesson.
  const unseen = status === 'published' && !lessons.some(l => l.status === 'published');
  const href = `modules.html?module=${m.module_id}`;
  const title = escHtml(m.title);
  const mix = ContentFormat.kindCounts(lessons)
    .map(k => `<span class="t-${k.kind}">${Studio.icon(k.icon)}${k.count > 1 ? k.count + ' ' : ''}${escHtml(k.label)}</span>`).join('');
  const note = lessons.length
    ? 'No published lessons yet. Students can’t see this module until one is published.'
    : 'No lessons yet. Students can’t see this module until it has one published lesson.';
  const action = unseen || !lessons.length
    ? `<a class="cs-btn cs-btn--sm" href="${href}" aria-label="Add a lesson to ${title}">${Studio.icon('plus', 'cs-ico--sm')}Add lesson</a>`
    : `<a class="cs-btn cs-btn--sm" href="${href}" aria-label="Open ${title}">Open${Studio.icon('arrow-right', 'cs-ico--sm')}</a>`;
  return `<article class="cs-mod cs-mod--${status}" style="--sys:${look.colour}" data-id="${m.module_id}">
    <div class="cs-mod-art">${look.art ? `<img src="${look.art}" alt="" loading="lazy" decoding="async">` : ''}${Studio.status(status)}</div>
    <div class="cs-mod-body">
      <span class="cs-eyebrow">${escHtml(m.system_name)}</span>
      <h3 class="cs-h3">${title}</h3>
      ${m.description ? `<p class="cs-body cs-clamp">${escHtml(m.description)}</p>` : '<p class="cs-body cs-body--none">No description yet</p>'}
      ${mix ? `<div class="cs-mix">${mix}</div>` : ''}
      ${unseen ? `<div class="cs-warn">${Studio.icon('warning-circle', 'cs-ico--sm')}<span>${note}</span></div>` : ''}
    </div>
    <div class="cs-mod-foot">
      <span class="cs-meta">${count(lessons.length, 'lesson')}${m.material_count ? ' · ' + count(m.material_count, 'material') : ''}</span>
      ${action}
      <button type="button" class="cs-icon-btn" data-more="${m.module_id}" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for ${title}">${Studio.icon('dots-three')}</button>
    </div>
  </article>`;
}

function moduleMenu(m) {
  const edit = { label: 'Edit details', onSelect: () => openModuleSheet(m) };
  if (m.status === 'archived') return [edit, { label: 'Restore as draft', onSelect: () => setModuleStatus(m, 'draft') }];
  return [
    edit,
    m.status === 'published'
      ? { label: 'Unpublish', onSelect: () => setModuleStatus(m, 'draft') }
      : { label: 'Publish', onSelect: () => setModuleStatus(m, 'published') },
    { label: 'Archive', danger: true, onSelect: () => archiveModule(m.module_id) },
  ];
}

// ── Saving ────────────────────────────────────────────────────
async function saveModule(method, moduleId, payload) {
  try {
    const res = await fetch(`${API_BASE}/modules.php${moduleId ? `?id=${moduleId}` : ''}`, {
      method,
      headers:     payload ? { 'Content-Type': 'application/json' } : undefined,
      credentials: 'same-origin',
      body:        payload ? JSON.stringify(payload) : undefined,
    });
    return await res.json();
  } catch (e) {
    return { success: false, message: 'Server error. Make sure XAMPP is running.' };
  }
}

async function setModuleStatus(m, status) {
  const done = status === 'published' ? 'Module published.'
    : m.status === 'archived' ? 'Module restored as a draft.' : 'Module unpublished.';
  const result = await saveModule('PUT', m.module_id, { status });
  if (!result.success) { showToast(result.message || 'The module could not be updated.', 'error'); return; }
  showToast(done, 'success');
  loadModules();
}

async function archiveModule(moduleId) {
  const ok = await confirmToast({ title: 'Archive this module?', message: 'Students will no longer see it.', confirmText: 'Archive', cancelText: 'Cancel' });
  if (!ok) return;
  const result = await saveModule('DELETE', moduleId);
  if (!result.success) { showToast(result.message || 'The module could not be archived.', 'error'); return; }
  showToast('Module archived.', 'success');
  loadModules();
}

// ── Module sheet: title, body system, description, status ───
// The body system is fixed once a module exists (the API cannot move it, and its linked
// assessments keep their system), so editing shows it read-only.
function openModuleSheet(module) {
  const editing = Boolean(module);
  const current = module?.status || 'draft';
  const statuses = [['published', 'Published'], ['draft', 'Draft']];
  if (current === 'archived') statuses.push(['archived', 'Archived']);

  const form = document.createElement('form');
  form.id = 'moduleSheetForm';
  form.innerHTML = `
    <div class="cs-field"><label for="msTitle">Title</label>
      <input class="cs-input" id="msTitle" name="title" required maxlength="200" autocomplete="off" placeholder="e.g. Bones of the body" value="${escHtml(module?.title || '')}"/></div>
    ${editing
      ? `<div class="cs-field"><span class="cs-label" id="msSystemLabel">Body system</span>
          <div class="cs-input cs-input--static" aria-labelledby="msSystemLabel" style="--sys:${ContentFormat.systemLook(module.system_code).colour}"><span class="cs-sw"></span>${escHtml(module.system_name)}</div>
          <span class="cs-hint">A module stays in the body system it was made for.</span></div>`
      : `<div class="cs-field"><label for="msSystem">Body system</label>
          <span class="cs-pick"><select class="cs-input" id="msSystem" name="system_id" required><option value="">Choose a body system</option>${allSystems.map(s => `<option value="${s.system_id}">${escHtml(s.system_name)}</option>`).join('')}</select>${Studio.icon('caret-down', 'cs-ico--sm')}</span></div>`}
    <div class="cs-field"><label for="msDesc">Description <span class="cs-meta">(optional)</span></label>
      <textarea class="cs-input cs-input--area" id="msDesc" name="description" rows="4" placeholder="What this module covers, in a sentence or two">${escHtml(module?.description || '')}</textarea></div>
    <div class="cs-field" role="radiogroup" aria-labelledby="msStatusLabel"><span class="cs-label" id="msStatusLabel">Status</span>
      <div class="cs-seg">${statuses.map(([value, label]) => `<label><input type="radio" name="status" value="${value}"${value === current ? ' checked' : ''}/>${label}</label>`).join('')}</div>
      <span class="cs-hint">Students see a published module once it has a published lesson.</span></div>`;

  const foot = document.createElement('div');
  foot.innerHTML = `<span class="cs-meta" id="msNote" role="status"></span>
    <button type="button" class="cs-btn" data-cancel>Cancel</button>
    <button type="submit" class="cs-btn cs-btn--primary" form="moduleSheetForm">${editing ? 'Save details' : 'Create module'}</button>`;

  const sheet = Studio.sheet({ eyebrow: editing ? module.title : 'Modules', title: editing ? 'Edit details' : 'New module', body: form, footer: foot });
  const cancel = foot.querySelector('[data-cancel]');
  cancel.addEventListener('click', () => sheet.close());
  let saving = false;
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (saving) return;
    const note = foot.querySelector('#msNote');
    const save = foot.querySelector('[type="submit"]');
    const fields = form.elements;
    const fail = message => { note.textContent = message; note.classList.add('is-error'); };
    const title = fields.title.value.trim();
    if (!title) { fail('Add a title.'); fields.title.focus(); return; }
    const payload = { title, description: fields.description.value.trim(), status: fields.status.value };
    if (!editing) payload.system_id = Number(fields.system_id.value);
    saving = true;
    save.disabled = cancel.disabled = true;
    sheet.setBusy(true);
    note.classList.remove('is-error');
    note.textContent = 'Saving…';
    const result = await saveModule(editing ? 'PUT' : 'POST', editing ? module.module_id : null, payload);
    sheet.setBusy(false);
    if (!result.success) {
      saving = false;
      save.disabled = cancel.disabled = false;
      fail(result.message || 'The module could not be saved.');
      return;
    }
    sheet.setDirty(false);   // saved: stays "saving" so a stray Enter cannot submit again while the sheet closes
    await sheet.close();
    showToast(editing ? 'Details saved.' : 'Module created.', 'success');
    loadModules();
  });
}

// ── Page events ───────────────────────────────────────────────
document.getElementById('newModuleBtn').addEventListener('click', () => openModuleSheet(null));
document.getElementById('moduleGrid').addEventListener('click', event => {
  const open = event.target.closest('a[href*="?module="]');
  if (open && isPlainClick(event)) {
    event.preventDefault();
    history.pushState({ fromGrid: true }, '', open.getAttribute('href'));
    route();
    return;
  }
  const more = event.target.closest('[data-more]');
  if (more) {
    const module = moduleById(Number(more.dataset.more));
    if (module) Studio.menu(more, moduleMenu(module));
    return;
  }
  if (event.target.closest('[data-new-module]')) openModuleSheet(null);
  if (event.target.closest('[data-clear-filters]')) clearFilters();
});
document.getElementById('statusFilter').addEventListener('click', event => {
  const button = event.target.closest('[data-status]');
  if (!button) return;
  filters.status = button.dataset.status;
  document.querySelectorAll('#statusFilter [data-status]').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
  renderModules();
});
document.getElementById('systemFilter').addEventListener('change', event => {
  filters.system = event.target.value;
  renderModules();
});
document.getElementById('moduleSearch').addEventListener('input', event => {
  filters.query = event.target.value.trim().toLowerCase();
  renderModules();
});

// ── Views: the grid, or one module's workspace (?module=<id>) ───
// Opening a module adds a history entry, so Back returns to the grid as it was left, filters included.
// ?module_id= is the 3D explorer's older link and opens the same view. The workspace itself is
// assets/js/module-workspace.js.
const gridView = document.getElementById('gridView');
const workspaceView = document.getElementById('workspaceView');
const GRID_TITLE = document.title;
let openModuleId = null;
let gridScroll = 0;
const isPlainClick = event => event.button === 0 && !(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey);

function moduleParam() {
  const params = new URLSearchParams(location.search);
  return Number(params.get('module') || params.get('module_id')) || null;
}

const workspaceHooks = {
  previewRoot: document.getElementById('lessonPreview'),
  reload: () => loadModules(),
  editDetails: module => openModuleSheet(module),
  setStatus: (module, status) => setModuleStatus(module, status),
  addLesson: moduleId => openLessonSheet(moduleId, null),
  editLesson: (moduleId, lesson) => openLessonSheet(moduleId, lesson),
  back(event) {
    if (!isPlainClick(event)) return;
    event.preventDefault();
    if (history.state?.fromGrid) { history.back(); return; }
    history.pushState(null, '', 'modules.html');
    route();
  },
};

function showWorkspace(moduleId) {
  const module = moduleById(moduleId);
  if (!module) {
    showToast('That module could not be found.', 'error');
    history.replaceState(null, '', 'modules.html');
    showGrid();
    return;
  }
  if (!gridView.hidden) gridScroll = scrollY;
  gridView.hidden = true;
  workspaceView.hidden = false;
  if (openModuleId === moduleId) ModuleWorkspace.update(module);
  else ModuleWorkspace.open(workspaceView, module, workspaceHooks);
  openModuleId = moduleId;
  document.title = `${module.title} | Anthropotomy`;
  scrollTo(0, 0);
  document.getElementById('wsTitle').focus({ preventScroll: true });
}

function showGrid() {
  const from = openModuleId;
  openModuleId = null;
  ModuleWorkspace.close();
  workspaceView.textContent = '';
  workspaceView.hidden = true;
  gridView.hidden = false;
  document.title = GRID_TITLE;
  if (allModules.length) { renderSummary(); renderModules(); }
  scrollTo(0, from ? gridScroll : 0);
  const card = from && document.querySelector(`#moduleGrid .cs-mod[data-id="${from}"] .cs-mod-foot a`);
  (card || document.getElementById('pageTitle')).focus({ preventScroll: true });
}

function route() {
  const id = moduleParam();
  if (id) showWorkspace(id);
  else if (openModuleId !== null || gridView.hidden) showGrid();
}

// ── Lesson sheet (assets/js/lesson-sheet.js) ──────────────────
// A save reloads the module list, which redraws the open workspace.
function openLessonSheet(moduleId, lesson) {
  const module = moduleById(moduleId);
  const at = lesson ? (module?.lessons || []).findIndex(l => String(l.lesson_id) === String(lesson.lesson_id)) : -1;
  return LessonSheet.open(moduleId, lesson, { onSaved: () => loadModules(), moduleTitle: module?.title, position: at >= 0 ? at + 1 : null });
}

// ── Init ──────────────────────────────────────────────────────
history.scrollRestoration = 'manual';
if (moduleParam()) {
  gridView.hidden = true;
  workspaceView.hidden = false;
  workspaceView.innerHTML = '<div class="cs-empty" role="status"><p>Loading module…</p></div>';
  if (new URLSearchParams(location.search).has('module_id')) history.replaceState(null, '', `modules.html?module=${moduleParam()}`);
}
addEventListener('popstate', route);
loadModules().then(loaded => {
  if (loaded) route();
  else if (gridView.hidden) { workspaceView.hidden = true; workspaceView.textContent = ''; gridView.hidden = false; }
});
</script>
<script src="../assets/js/site-config.js"></script>
</body>
</html>
