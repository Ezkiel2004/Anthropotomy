<body class="teacher-dashboard stage-portal">
<div class="app-layout">
  <aside class="sidebar" id="sidebar" data-portal="teacher" aria-label="Teacher portal"><script src="../assets/js/sidebar.js?v=20261106-photo1"></script></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content" id="mainContent">
    <header class="topbar">
      <button class="topbar-toggle" id="sidebarToggle"><svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#list"/></svg></button>
      <div class="topbar-breadcrumb"><span class="breadcrumb-item">Teacher Portal</span><span class="breadcrumb-sep">/</span><span class="breadcrumb-current">Assessments</span></div>
      <div class="topbar-actions">
        <div style="position:relative;">
          <button class="notif-btn" id="notifBtn" aria-label="Notifications">
            <svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#bell"/></svg>
            <span class="notif-dot"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" style="display:none;">
            <div class="notif-header"><span>Notifications</span><a href="#" style="font-size:0.75rem;color:var(--brand);">Mark all read</a></div>
            <div class="notif-list"></div>
            <div class="notif-footer"><a href="announcements.html">View all notifications</a></div>
          </div>
        </div>
        <div class="topbar-user">
          <div class="avatar" style="width:32px;height:32px;font-size:0.7rem;">CR</div>
          <div>
            <div class="topbar-user-name">Teacher</div>
            <div class="topbar-user-role">Science Teacher</div>
          </div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="cs" id="assessView">
        <header class="cs-head page-header">
          <div class="page-header-left">
            <h1 id="pageTitle" tabindex="-1">Assessments</h1>
            <p>Mix any question types in one assessment. Students see only the ones that are open.</p>
          </div>
          <div class="cs-actions">
            <button type="button" class="cs-btn cs-btn--primary" id="newAssessmentBtn"><svg class="cs-ico" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#plus"/></svg>New assessment</button>
          </div>
        </header>

        <div class="cs-summary" aria-label="Assessment summary">
          <div><i style="background:var(--cs-mint)"></i><b class="cs-num" id="sumOpen">0</b><span>open</span></div>
          <div><i style="background:var(--cs-amber)"></i><b class="cs-num" id="sumDraft">0</b><span>drafts</span></div>
          <div><i style="background:var(--cs-faint)"></i><b class="cs-num" id="sumClosed">0</b><span>closed</span></div>
          <div><b class="cs-num" id="sumAttempts">0</b><span>attempts</span></div>
        </div>

        <div class="cs-toolbar cs-toolbar--assess" role="search">
          <label class="cs-search"><svg class="cs-ico" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#magnifying-glass"/></svg><input type="search" id="assessSearch" placeholder="Search assessments" aria-label="Search assessments" autocomplete="off"/></label>
          <label class="cs-select"><span class="cs-sr">Body system</span><select id="assessSystemFilter"><option value="">All body systems</option></select><svg class="cs-ico cs-ico--sm" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#caret-down"/></svg></label>
        </div>

        <div class="cs-alist" id="assessList"></div>
        <p class="cs-sr" id="assessResults" role="status"></p>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/app.js?v=20261106-review1"></script>
<script src="../assets/js/content-format.js?v=20261111-cf1"></script>
<script src="../assets/js/content-studio.js?v=20261111-cs4"></script>
<script src="../assets/js/assessment-list.js?v=20261111-al1"></script>
<script src="../assets/js/question-builder.js?v=20261111-qb1"></script>
<script>
'use strict';
Auth.requireAuthSync('teacher');

// The list lives in assets/js/assessment-list.js and the question builder in assets/js/question-builder.js.
// A row's Questions button and Create and add questions open the builder; its changes reload the list.
QuestionBuilder.init({
  find: id => AssessmentList.find(id),
  refresh: () => AssessmentList.load(),
  // Focus goes back to the row's Questions button when the list was redrawn behind the builder.
  onClose: id => {
    if (document.activeElement && document.activeElement !== document.body) return;
    document.querySelector(`#assessList [data-questions="${Number(id)}"]`)?.focus();
  },
});
AssessmentList.init({ openQuestions: id => openQuestionBuilder(id) });
function loadAssessments() { return AssessmentList.load(); }
function openAssessmentSheet(assessment) { return AssessmentList.openSheet(assessment || null); }
function openQuestionBuilder(assessmentId) { return QuestionBuilder.open(assessmentId); }
function openQuestionForm(assessmentId, question = null) { return QuestionBuilder.openForm(assessmentId, question); }
</script>
<script src="../assets/js/site-config.js"></script>
</body>
</html>
