  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 800; src: url("../../assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); }

  h1 em { color: var(--accent); }
  .tagline { position: absolute; left: 80px; bottom: 72px; font-size: 24px; color: var(--muted); }
  .stage { position: absolute; right: 80px; top: 40px; width: 440px; height: 550px; overflow: hidden; border-radius: 16px; border: 1px solid var(--rule); background: var(--surface); }

</head>

</html>
