<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications | Anthropotomy</title>
  <meta name="theme-color" content="#121212"/>
  <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48"/>
  <link rel="preload" href="../assets/fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="../assets/fonts/plus-jakarta-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="../assets/css/global.css?v=20261012-buttons1"/>
  <link rel="stylesheet" href="../assets/css/sidebar.css?v=20261005-brand1"/>
  <link rel="stylesheet" href="../assets/css/student-portal.css?v=20261014-school1"/>
  <link rel="stylesheet" href="../assets/css/stage-portal.css?v=20261016-stage3"/>
</head>
<body class="student-dashboard stage-portal">
<div class="app-layout">
  <aside class="sidebar" id="sidebar" data-portal="student" aria-label="Student portal"><script src="../assets/js/sidebar.js?v=20261016-stage3"></script></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content" id="mainContent">
    <header class="topbar">
      <button class="topbar-toggle" id="sidebarToggle" aria-label="Toggle navigation"><svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#list"/></svg></button>
      <a class="sd-brand" href="../index.html" aria-label="Anthropotomy home"><img src="../assets/brand/mark-96.png" width="36" height="36" alt=""/></a>
      <div class="topbar-breadcrumb"><span class="breadcrumb-item">Student Portal</span><span class="breadcrumb-sep">/</span><span class="breadcrumb-current">Notifications</span></div>
      <div class="topbar-actions">
        <div style="position:relative;">
          <button class="notif-btn" id="notifBtn" aria-label="Notifications">
            <svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#bell"/></svg>
            <span class="notif-dot" style="display:none;" aria-hidden="true"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" style="display:none;">
            <div class="notif-header"><span>Notifications</span></div>
            <div class="notif-list"></div>
          </div>
        </div>
        <a href="settings.html" class="topbar-user" style="text-decoration:none;color:inherit;" title="Manage Account">
          <div class="avatar">MS</div>
          <div>
            <div class="topbar-user-name">Student</div>
            <div class="topbar-user-role">Student</div>
          </div>
        </a>
      </div>
    </header>

    <div class="page-content sd">
      <header class="sd-head">
        <div>
          <h1 class="sd-title">Notifications</h1>
          <p class="sd-sub" id="notifIntro">New lessons, quiz reminders, scores and news from your teacher.</p>
        </div>
        <button type="button" class="sd-go sd-go--light sd-go--sm" id="markAllBtn" onclick="markAllRead()">Mark all read<span class="sd-go-disc"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#check"/></svg></span></button>
      </header>

      <section class="sd-block" aria-labelledby="notifListTitle">
        <h2 id="notifListTitle" class="sr-only">All notifications</h2>
        <div class="sd-stack">
          <div class="sd-seg" id="filterTabs" role="group" aria-label="Show notifications">
            <button type="button" class="active" data-filter="all" aria-pressed="true">All <span class="chip-count" id="countAll">0</span></button>
            <button type="button" data-filter="unread" aria-pressed="false">Unread <span class="chip-count" id="countUnread">0</span></button>
            <button type="button" data-filter="lesson" aria-pressed="false">Lessons</button>
            <button type="button" data-filter="quiz" aria-pressed="false">Quizzes</button>
            <button type="button" data-filter="score" aria-pressed="false">Scores</button>
            <button type="button" data-filter="announcement" aria-pressed="false">Announcements</button>
          </div>
        </div>
        <div class="sd-notifs" id="notifList"><div class="sd-loading">Loading notifications…</div></div>
      </section>
    </div>
  </main>
</div>

<script src="../assets/js/app.js?v=20261016-auth1"></script>
<script src="../assets/js/student-portal.js?v=20261016-stage3"></script>
<script>
'use strict';
Auth.requireAuthSync('student');

const NOTIF_ICONS = { lesson: 'book-open', quiz: 'exam', score: 'chart-line', announcement: 'megaphone' };
let notifItems = [];
let currentFilter = 'all';

async function loadNotifications() {
  await Notifications.load(true);
  if (!Notifications.loaded) {
    document.getElementById('notifList').innerHTML = '<div class="dashboard-empty sd-error" role="status">Unable to load notifications. Please refresh to try again.</div>';
  }
}

document.addEventListener('notifications:updated', event => {
  notifItems = event.detail;
  const unread = notifItems.filter(n => n.unread).length;
  document.getElementById('countAll').textContent = notifItems.length;
  document.getElementById('countUnread').textContent = unread;
  document.getElementById('markAllBtn').disabled = unread === 0;
  document.getElementById('notifIntro').textContent = unread ? `You have ${plural(unread, 'unread notification')}.` : 'You’re all caught up.';
  renderNotifs();
});

document.getElementById('filterTabs').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  currentFilter = button.dataset.filter;
  document.querySelectorAll('#filterTabs button').forEach(b => {
    b.classList.toggle('active', b === button);
    b.setAttribute('aria-pressed', String(b === button));
  });
  renderNotifs();
});

function renderNotifs() {
  const data = currentFilter === 'all' ? notifItems
    : currentFilter === 'unread' ? notifItems.filter(n => n.unread)
    : notifItems.filter(n => n.type === currentFilter);

  if (!data.length) {
    document.getElementById('notifList').innerHTML = `<div class="dashboard-empty">${currentFilter === 'unread' ? 'All caught up. No unread notifications.' : notifItems.length ? 'Nothing here in this category.' : 'No notifications yet. They’ll appear here when your teacher posts something.'}</div>`;
    return;
  }

  document.getElementById('notifList').innerHTML = data.map(n => `
    <button type="button" class="sd-notif${n.unread ? ' is-unread' : ''}" id="notif-card-${escHtml(String(n.id))}" data-id="${escHtml(String(n.id))}">
      <span class="sd-notif-icon">${icon(NOTIF_ICONS[n.type] || 'bell')}</span>
      <span class="sd-notif-copy">
        <span class="sd-notif-title">${escHtml(n.title)}${n.unread ? '<span class="sr-only"> (unread)</span>' : ''}</span>
        <span class="sd-notif-body">${escHtml(n.body)}</span>
        <span class="sd-notif-time">${escHtml(n.time || '')}</span>
      </span>
      ${n.unread ? '<span class="sd-notif-dot" aria-hidden="true"></span>' : ''}
    </button>`).join('');
}

document.getElementById('notifList').addEventListener('click', event => {
  const card = event.target.closest('[data-id]');
  if (card) readNotif(card.dataset.id);
});

async function readNotif(id) {
  await Notifications.open(id);
}

async function markAllRead() {
  if (await Notifications.markAllRead()) showToast('All notifications marked as read.', 'success');
}

loadNotifications();
</script>
<script src="../assets/js/site-config.js"></script>
</body>
</html>
