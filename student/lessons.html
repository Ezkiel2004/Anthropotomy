<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Lessons | Anthropotomy</title>
  <meta name="theme-color" content="#121212"/>
  <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48"/>
  <link rel="preload" href="../assets/fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="../assets/fonts/plus-jakarta-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="../assets/css/global.css?v=20261012-buttons1"/>
  <link rel="stylesheet" href="../assets/css/sidebar.css?v=20261005-brand1"/>
  <link rel="stylesheet" href="../assets/css/student-portal.css?v=20261019-acct1"/>
  <link rel="stylesheet" href="../assets/css/stage-portal.css?v=20261019-acct1"/>
  <script type="module" src="../assets/js/gravity-stars.js?v=20261019-stars2"></script>
</head>
<body class="student-dashboard stage-portal" data-gravity-stars>
<div class="app-layout">
  <aside class="sidebar" id="sidebar" data-portal="student" aria-label="Student portal"><script src="../assets/js/sidebar.js?v=20261020-games1"></script></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content" id="mainContent">
    <header class="topbar">
      <button class="topbar-toggle" id="sidebarToggle" aria-label="Toggle navigation"><svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#list"/></svg></button>
      <a class="sd-brand" href="../index.html" aria-label="Anthropotomy home"><img src="../assets/brand/mark-96.png" width="36" height="36" alt=""/></a>
      <div class="topbar-breadcrumb"><span class="breadcrumb-item">Student Portal</span><span class="breadcrumb-sep">/</span><span class="breadcrumb-current">My Lessons</span></div>
      <div class="topbar-actions">
        <div style="position:relative;">
          <button class="notif-btn" id="notifBtn" aria-label="Notifications">
            <svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#bell"/></svg>
            <span class="notif-dot" style="display:none;" aria-hidden="true"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" style="display:none;">
            <div class="notif-header"><span>Notifications</span><a href="notifications.html">Mark all read</a></div>
            <div class="notif-list"></div>
            <div class="notif-footer"><a href="notifications.html">View all</a></div>
          </div>
        </div>
        <a href="settings.html" class="topbar-user" style="text-decoration:none;color:inherit;" title="Manage Account">
          <div class="avatar">MS</div>
          <div>
            <div class="topbar-user-name">Student</div>
            <div class="topbar-user-role">Student</div>
          </div>
        </a>
      </div>
    </header>

    <div class="page-content sd">
      <header class="sd-head">
        <div>
          <h1 class="sd-title">My lessons</h1>
          <p class="sd-sub" id="lessonsIntro">Study each body system at your own pace.</p>
        </div>
      </header>

      <dl class="sd-stats sd-stats--row" aria-label="Your lessons at a glance">
        <div class="sd-stat"><dt>Modules</dt><dd><span class="sd-stat-value" id="statTotalModules">0</span><span class="sd-stat-hint" id="statTotalLessonsLabel">Loading…</span></dd></div>
        <div class="sd-stat"><dt>Finished</dt><dd><span class="sd-stat-value" id="statCompletedModules">0</span><span class="sd-stat-hint">Modules complete</span></dd></div>
        <div class="sd-stat"><dt>In progress</dt><dd><span class="sd-stat-value" id="statInProgressModules">0</span><span class="sd-stat-hint">Modules started</span></dd></div>
        <div class="sd-stat"><dt>Lessons done</dt><dd><span class="sd-stat-value" id="statOverallPct">0%</span><span class="sd-stat-hint" id="statCompletedLessonsLabel">Loading…</span></dd></div>
      </dl>

      <section class="sd-block" aria-labelledby="availableModulesTitle">
        <div class="sd-stack">
          <div class="sd-tools">
            <label class="sd-search">
              <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#magnifying-glass"/></svg>
              <span class="sr-only">Search modules</span>
              <input type="search" id="lessonSearchInput" placeholder="Search modules or body systems" autocomplete="off" oninput="handleLessonSearch(this.value)">
            </label>
            <div class="sd-filters">
              <select id="lessonSystemFilter" class="sd-select" aria-label="Filter by body system" onchange="handleLessonSystemFilter(this.value)"><option value="all">All body systems</option></select>
              <select id="lessonSortFilter" class="sd-select" aria-label="Sort modules" onchange="handleLessonSort(this.value)">
                <option value="curriculum">Course order</option>
                <option value="progress-desc">Most progress</option>
                <option value="progress-asc">Least progress</option>
                <option value="alpha">Title, A to Z</option>
              </select>
            </div>
          </div>
          <div class="sd-seg" id="statusFilterChips" role="group" aria-label="Show modules">
            <button type="button" class="filter-chip-btn active" data-status="all" aria-pressed="true" onclick="setLessonStatusFilter('all')">All <span class="chip-count" id="countAll">0</span></button>
            <button type="button" class="filter-chip-btn" data-status="in-progress" aria-pressed="false" onclick="setLessonStatusFilter('in-progress')">In progress <span class="chip-count" id="countInProgress">0</span></button>
            <button type="button" class="filter-chip-btn" data-status="not-started" aria-pressed="false" onclick="setLessonStatusFilter('not-started')">Not started <span class="chip-count" id="countNotStarted">0</span></button>
            <button type="button" class="filter-chip-btn" data-status="completed" aria-pressed="false" onclick="setLessonStatusFilter('completed')">Finished <span class="chip-count" id="countCompleted">0</span></button>
          </div>
        </div>

        <div class="sd-h"><h2 id="availableModulesTitle" class="sd-h-title">Modules</h2><span class="sd-count" id="lessonResultsCount" role="status">Loading modules…</span></div>
        <div class="sd-grid" id="lessonGrid"></div>
      </section>
    </div>
  </main>
</div>

<!-- Module: its lessons, one click to open each -->
<div class="modal-overlay" id="lessonModal" style="display:none;" onclick="if(event.target===this)closeModal('lessonModal')">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="lessonModalTitle">
    <div class="modal-header">
      <h3 id="lessonModalTitle">Module</h3>
      <button class="modal-close" onclick="closeModal('lessonModal')" aria-label="Close dialog"><svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#x-circle"/></svg></button>
    </div>
    <div class="modal-body" id="lessonModalBody"></div>
    <div class="modal-footer">
      <a id="lessonModalExploreBtn" href="anatomy.html" class="sd-ghost"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#cube"/></svg>View in 3D</a>
      <span class="sd-modal-spacer"></span>
      <a id="lessonModalQuizBtn" href="quiz.html" class="sd-go sd-go--light sd-go--sm">Take a quiz<span class="sd-go-disc"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#arrow-right"/></svg></span></a>
    </div>
  </div>
</div>

<!-- Lesson reader: a full-screen page, filled when a lesson opens -->
<div class="sd-reader" id="lessonContentViewer" role="dialog" aria-modal="true" aria-labelledby="readerTitle" hidden></div>

<script src="../assets/js/app.js?v=20261019-acct1"></script>
<script src="../assets/js/student-portal.js?v=20261019-acct1"></script>
<script>
'use strict';
Auth.requireAuthSync('student');

let allModules           = [];
let currentStatusFilter  = 'all';
let currentSystemFilter  = 'all';
let currentSort          = 'curriculum';
let searchTerm           = '';

const systemShort = name => String(name || '').replace(/\s+System$/i, '');

// ── Load modules from API ──────────────────────────────────────
async function loadLessons() {
  const grid = document.getElementById('lessonGrid');
  grid.innerHTML = '<div class="sd-loading">Loading modules…</div>';
  try {
    const res    = await fetch(`${API_BASE}/modules.php`, { credentials: 'same-origin' });
    const result = await res.json();
    if (!result.success) throw new Error(result.message || 'Modules unavailable');
    // A module without published lessons has nothing to open, so students don't see it.
    allModules = (result.data || []).filter(m => Number(m.lesson_count) > 0);
    updateSummaryMetrics();
    renderLessons();
  } catch (e) {
    document.getElementById('lessonResultsCount').textContent = 'Modules unavailable';
    grid.innerHTML = '<div class="dashboard-empty sd-error" role="status">We couldn’t load your lessons. Please refresh to try again.</div>';
  }
}

// ── Update top summary stats and filter counts ─────────────────
function updateSummaryMetrics() {
  let completedModules = 0, inProgressModules = 0, notStartedModules = 0, totalCompletedLessons = 0, totalLessons = 0;
  allModules.forEach(m => {
    const pct = parseFloat(m.completion_pct || 0);
    totalLessons += parseInt(m.lesson_count || 0);
    totalCompletedLessons += parseInt(m.completed_lessons || 0);
    if (pct >= 100) completedModules++;
    else if (pct > 0) inProgressModules++;
    else notStartedModules++;
  });
  const overallPct = totalLessons > 0 ? Math.round((totalCompletedLessons / totalLessons) * 100) : 0;

  document.getElementById('statTotalModules').textContent = allModules.length;
  document.getElementById('statTotalLessonsLabel').textContent = `${plural(totalLessons, 'lesson')} in all`;
  document.getElementById('statCompletedModules').textContent = completedModules;
  document.getElementById('statInProgressModules').textContent = inProgressModules;
  document.getElementById('statOverallPct').textContent = overallPct + '%';
  document.getElementById('statCompletedLessonsLabel').textContent = `${totalCompletedLessons} of ${plural(totalLessons, 'lesson')}`;
  document.getElementById('lessonsIntro').textContent = totalLessons === 0 ? 'Lessons appear here when your teacher publishes them.'
    : totalCompletedLessons >= totalLessons ? 'You’ve finished every published lesson. Nice work.'
    : totalCompletedLessons > 0 ? `You’ve finished ${totalCompletedLessons} of ${plural(totalLessons, 'lesson')}. Keep going.`
    : 'Study each body system at your own pace.';

  document.getElementById('countAll').textContent = allModules.length;
  document.getElementById('countCompleted').textContent = completedModules;
  document.getElementById('countInProgress').textContent = inProgressModules;
  document.getElementById('countNotStarted').textContent = notStartedModules;
}

// ── Render module cards ────────────────────────────────────────
function renderLessons() {
  let data = [...allModules];

  if (searchTerm) {
    data = data.filter(m =>
      (m.title && m.title.toLowerCase().includes(searchTerm)) ||
      (m.system_name && m.system_name.toLowerCase().includes(searchTerm)) ||
      (m.description && m.description.toLowerCase().includes(searchTerm))
    );
  }
  if (currentStatusFilter === 'completed') {
    data = data.filter(m => (m.completion_pct || 0) >= 100);
  } else if (currentStatusFilter === 'in-progress') {
    data = data.filter(m => (m.completion_pct || 0) > 0 && (m.completion_pct || 0) < 100);
  } else if (currentStatusFilter === 'not-started') {
    data = data.filter(m => !(m.completion_pct || 0));
  }
  if (currentSystemFilter !== 'all') {
    data = data.filter(m => m.system_code === currentSystemFilter);
  }
  if (currentSort === 'progress-desc') {
    data.sort((a, b) => (parseFloat(b.completion_pct || 0) - parseFloat(a.completion_pct || 0)));
  } else if (currentSort === 'progress-asc') {
    data.sort((a, b) => (parseFloat(a.completion_pct || 0) - parseFloat(b.completion_pct || 0)));
  } else if (currentSort === 'alpha') {
    data.sort((a, b) => a.title.localeCompare(b.title));
  }

  document.getElementById('lessonResultsCount').textContent = `${data.length} of ${plural(allModules.length, 'module')}`;

  const grid = document.getElementById('lessonGrid');
  if (!data.length) {
    grid.innerHTML = allModules.length
      ? `<div class="sd-empty"><p class="sd-empty-title">No modules match</p><p>Try another filter or clear your search.</p><button type="button" class="sd-ghost" onclick="resetFilters()">Clear filters</button></div>`
      : `<div class="sd-empty"><p class="sd-empty-title">Your lessons are on the way</p><p>Your teacher hasn’t published any lessons yet. While you wait, explore the body in 3D.</p><a class="sd-go sd-go--light sd-go--sm" href="anatomy.html">Explore 3D Anatomy<span class="sd-go-disc">${icon('arrow-right')}</span></a></div>`;
    return;
  }

  grid.innerHTML = data.map(m => {
    const look = systemLook(m.system_code);
    const pct = Math.round(parseFloat(m.completion_pct || 0));
    const lessons = Number(m.lesson_count) || 0;
    const [chipClass, chipText, action] = pct >= 100 ? ['is-pass', 'Finished', 'Review']
      : pct > 0 ? ['is-progress', `${pct}% done`, 'Continue'] : ['', 'Not started', 'Start'];
    return `
      <article class="sd-mod" style="--card:${look.colour}">
        <div class="sd-mod-art">
          ${look.art ? `<img src="${look.art}" alt="" loading="lazy" width="560" height="640">` : `<span class="sd-sys-icon">${icon('book-open')}</span>`}
          <span class="sd-mod-system">${escHtml(systemShort(m.system_name))}</span>
          <span class="sd-chip ${chipClass}">${chipText}</span>
        </div>
        <div class="sd-mod-body">
          <h3 class="sd-mod-title">${escHtml(m.title)}</h3>
          ${m.description ? `<p class="sd-mod-desc">${escHtml(m.description)}</p>` : ''}
          <div class="sd-meter" role="progressbar" aria-label="${escHtml(m.title)} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
          <div class="sd-mod-foot">
            <span class="sd-mod-count">${Number(m.completed_lessons) || 0} of ${plural(lessons, 'lesson')}</span>
            <button type="button" class="sd-go sd-go--light sd-go--sm sd-stretch" onclick="viewModule(${m.module_id})">${action}<span class="sr-only"> ${escHtml(m.title)}</span><span class="sd-go-disc">${icon('arrow-right')}</span></button>
          </div>
        </div>
      </article>`;
  }).join('');
}

// ── Filter & Search Handlers ───────────────────────────────────
function handleLessonSearch(q) {
  searchTerm = q.trim().toLowerCase();
  renderLessons();
}

function setLessonStatusFilter(status) {
  currentStatusFilter = status;
  document.querySelectorAll('#statusFilterChips .filter-chip-btn').forEach(btn => {
    const on = btn.getAttribute('data-status') === status;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', String(on));
  });
  renderLessons();
}

function handleLessonSystemFilter(system) {
  currentSystemFilter = system;
  renderLessons();
}

function handleLessonSort(sort) {
  currentSort = sort;
  renderLessons();
}

function resetFilters() {
  searchTerm = '';
  currentSystemFilter = 'all';
  currentSort = 'curriculum';
  document.getElementById('lessonSearchInput').value = '';
  document.getElementById('lessonSystemFilter').value = 'all';
  document.getElementById('lessonSortFilter').value = 'curriculum';
  setLessonStatusFilter('all');
}

// ── View module detail + lessons ───────────────────────────────
async function viewModule(moduleId) {
  const module = allModules.find(m => m.module_id === moduleId);
  if (!module) return;

  const body = document.getElementById('lessonModalBody');
  document.getElementById('lessonModalTitle').textContent = module.title;
  body.innerHTML = '<div class="sd-loading">Loading lessons…</div>';
  document.getElementById('lessonModalExploreBtn').href = `anatomy.html?system=${encodeURIComponent(module.system_code || '')}`;
  document.getElementById('lessonModalQuizBtn').href = `quiz.html?system=${encodeURIComponent(module.system_code || '')}`;
  openModal('lessonModal');

  try {
    const res    = await fetch(`${API_BASE}/lessons.php?module_id=${moduleId}`, { credentials: 'same-origin' });
    const result = await res.json();
    const lessons = result.success ? result.data : [];
    const pct = Math.round(parseFloat(module.completion_pct || 0));
    const completedCount = lessons.filter(l => l.progress_status === 'completed').length;

    body.innerHTML = `
      <div class="sd-modsum" style="--card:${systemLook(module.system_code).colour}">
        ${module.description ? `<p>${escHtml(module.description)}</p>` : ''}
        <div class="sd-mod-foot"><span class="sd-mod-count">${escHtml(module.system_name || '')} · ${completedCount} of ${plural(lessons.length, 'lesson')} finished</span><span class="sd-chip ${pct >= 100 ? 'is-pass' : pct > 0 ? 'is-progress' : ''}">${pct}%</span></div>
        <div class="sd-meter" role="progressbar" aria-label="Module progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      </div>
      <div class="sd-lessons">
        ${lessons.length ? lessons.map((l, i) => {
          const isDone = l.progress_status === 'completed';
          const isInProg = l.progress_status === 'in_progress';
          const meta = [l.duration_mins ? l.duration_mins + ' min' : 'Self-paced', l.lesson_type ? l.lesson_type.replace('_', ' ') : 'Theory', isDone ? 'Finished' : isInProg ? 'In progress' : ''].filter(Boolean).join(' · ');
          return `
            <button type="button" class="sd-lesson${isDone ? ' is-done' : isInProg ? ' is-progress' : ''}" onclick="startLesson(${l.lesson_id})">
              <span class="sd-lesson-num">${isDone ? icon('check') : i + 1}</span>
              <span class="sd-lesson-copy"><span class="sd-lesson-title">${escHtml(l.title)}</span><span class="sd-lesson-meta">${escHtml(meta)}</span></span>
              <span class="sd-lesson-go">${isDone ? 'Review' : isInProg ? 'Continue' : 'Open'}${icon('arrow-right')}</span>
            </button>`;
        }).join('') : '<div class="dashboard-empty">This module has no lessons yet.</div>'}
      </div>`;
  } catch (e) {
    body.innerHTML = '<div class="dashboard-empty sd-error" role="status">We couldn’t load this module’s lessons. Please try again.</div>';
  }
}

// ── Start a lesson & open reader ───────────────────────────────
function renderLessonMedia(lesson) {
  if (!lesson.media_url) return '';
  const url = escHtml(lesson.media_url);
  const ext = lesson.media_url.split('?')[0].split('.').pop().toLowerCase();
  if (['mp4', 'webm'].includes(ext)) return `<video controls preload="metadata" src="${url}">Video playback is unavailable.</video>`;
  if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return `<img src="${url}" alt="${escHtml(lesson.title)}"/>`;
  if (ext === 'pdf') return `<iframe title="Lesson document" src="${url}"></iframe><p><a href="${url}" target="_blank" rel="noopener">Open the document in a new tab</a></p>`;
  if (ext === 'glb') return `<a class="sd-go sd-go--light" href="anatomy.html?system=${encodeURIComponent(lesson.system_code)}&lesson_id=${Number(lesson.lesson_id)}">Open the lesson model in 3D<span class="sd-go-disc">${icon('arrow-right')}</span></a>`;
  return `<p><a href="${url}" target="_blank" rel="noopener">Open the lesson attachment</a></p>`;
}
let readingLessonId = null, readingSeconds = 0, readingTick = Date.now();
setInterval(()=>{const now=Date.now();if(readingLessonId && !document.hidden)readingSeconds+=Math.min((now-readingTick)/1000,2);readingTick=now;},1000);
async function saveReadingTime(){if(!readingLessonId||readingSeconds<1)return;const payload={lesson_id:readingLessonId,status:'in_progress',time_spent_secs:Math.floor(readingSeconds)};readingSeconds=0;try{await fetch(API_BASE+'/progress.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload),keepalive:true});}catch(e){console.warn('Reading time could not be saved.');}}
setInterval(saveReadingTime,30000);window.addEventListener('pagehide',saveReadingTime);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveReadingTime();});
async function startLesson(lessonId) {
  await saveReadingTime();
  readingLessonId=lessonId;readingSeconds=0;readingTick=Date.now();
  try {
    const res    = await fetch(`${API_BASE}/lessons.php?id=${lessonId}`, { credentials: 'same-origin' });
    const result = await res.json();
    if (result.success && result.data) {
      closeModal('lessonModal');
      showLessonContent(result.data);
    } else {
      showToast('This lesson isn’t available right now.', 'warning');
    }
  } catch (e) {
    showToast('We couldn’t open the lesson. Check your connection and try again.', 'error');
  }
}

// ── Lesson reader ──────────────────────────────────────────────
function showLessonContent(lesson) {
  const viewer = document.getElementById('lessonContentViewer');
  const isDone = lesson.progress && lesson.progress.status === 'completed';
  const look = systemLook(lesson.system_code);
  const system = systemShort(lesson.system_name) || 'Anatomy';
  const explore = `anatomy.html?system=${encodeURIComponent(lesson.system_code || '')}`;
  const kicker = [lesson.module_title, lesson.duration_mins ? lesson.duration_mins + ' min read' : 'Self-paced'].filter(Boolean).map(escHtml).join(' · ');

  viewer.innerHTML = `
    <div class="sd-reader-bar">
      <button type="button" class="sd-ghost" onclick="closeLessonViewer()">${icon('arrow-left')}Lessons</button>
      <span class="sd-reader-bar-title" aria-hidden="true">${escHtml(lesson.title)}</span>
      <a class="sd-ghost" href="${explore}">${icon('cube')}View in 3D</a>
    </div>
    <div class="sd-reader-scroll">
      <article class="sd-reader-doc" style="--card:${look.colour}">
        <header>
          <p class="sd-reader-kicker"><b>${escHtml(system)}</b> · ${kicker}</p>
          <h2 class="sd-reader-title" id="readerTitle">${escHtml(lesson.title)}</h2>
        </header>
        ${lesson.media_url ? `<div class="sd-reader-media">${renderLessonMedia(lesson)}</div>` : ''}
        <div class="sd-reader-text">${lesson.content_text ? escHtml(lesson.content_text) : 'No lesson text has been provided.'}</div>
        <section class="sd-next sd-callout" data-tone="${look.tone}" style="--card:${look.colour}" aria-labelledby="practiceTitle">
          ${look.art ? `<img class="sd-next-art" src="${look.art}" alt="">` : ''}
          <div class="sd-next-copy">
            <p class="sd-next-kicker">Practice in 3D</p>
            <h3 class="sd-next-title" id="practiceTitle">See it on the body</h3>
            <p class="sd-next-detail">Open the ${escHtml(system.toLowerCase())} model and click any part to learn its name.</p>
          </div>
          <div class="sd-next-actions"><a class="sd-go" href="${explore}">Open 3D explorer<span class="sd-go-disc">${icon('arrow-right')}</span></a></div>
        </section>
      </article>
    </div>
    <div class="sd-reader-foot">
      <button type="button" class="sd-ghost" onclick="closeLessonViewer()">Close</button>
      <button type="button" id="btnMarkComplete" class="sd-go sd-go--yellow${isDone ? ' is-done' : ''}" onclick="markLessonComplete(${Number(lesson.lesson_id)})"${isDone ? ' disabled' : ''}>${isDone ? 'Finished' : 'Mark as finished'}<span class="sd-go-disc">${icon('check')}</span></button>
    </div>`;
  viewer.hidden = false;
  document.body.style.overflow = 'hidden';
  viewer.querySelector('.sd-reader-bar button').focus();
}

function closeLessonViewer() {
  saveReadingTime(); readingLessonId=null;
  const viewer = document.getElementById('lessonContentViewer');
  if (viewer.hidden) return;
  viewer.hidden = true;
  document.body.style.overflow = '';
  loadLessons();
}
document.getElementById('lessonContentViewer').addEventListener('keydown', e => { if (e.key === 'Escape') closeLessonViewer(); });

// ── Mark lesson complete ───────────────────────────────────────
async function markLessonComplete(lessonId) {
  const btn = document.getElementById('btnMarkComplete');
  btn.disabled = true;
  btn.firstChild.textContent = 'Saving…';

  try {
    const res = await fetch(`${API_BASE}/progress.php`, {
      method:      'POST',
      headers:     { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body:        JSON.stringify({ lesson_id: lessonId, status: 'completed', completion_pct: 100, time_spent_secs: Math.floor(readingSeconds) }),
    });
    const result = await res.json();
    if (result.success) {
      readingSeconds=0;
      btn.firstChild.textContent = 'Finished';
      btn.classList.add('is-done');
      showToast('Lesson finished. Your progress is saved.', 'success');
      setTimeout(closeLessonViewer, 700);
    } else {
      showToast(result.message || 'Could not save progress.', 'warning');
      btn.firstChild.textContent = 'Mark as finished';
      btn.disabled = false;
    }
  } catch (e) {
    showToast('Could not save progress.', 'error');
    btn.firstChild.textContent = 'Mark as finished';
    btn.disabled = false;
  }
}

loadLessons();
fetch(API_BASE+'/body-systems.php').then(r=>r.json()).then(result=>{if(!result.success)return;const select=document.getElementById('lessonSystemFilter');select.replaceChildren(new Option('All body systems','all'));result.data.forEach(s=>select.add(new Option(s.system_name,s.system_code)));}).catch(()=>{});
</script>
