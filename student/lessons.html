<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Lessons | Anthropotomy</title>
  <meta name="theme-color" content="#121212"/>
  <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48"/>
  <link rel="preload" href="../assets/fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="../assets/fonts/plus-jakarta-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="../assets/css/global.css?v=20261112-dialogs1"/>
  <link rel="stylesheet" href="../assets/css/sidebar.css?v=20261005-brand1"/>
  <link rel="stylesheet" href="../assets/css/student-portal.css?v=20261019-acct1"/>
  <link rel="stylesheet" href="../assets/css/stage-portal.css?v=20261112-shelf1"/>
  <link rel="stylesheet" href="../assets/css/minimal-portal.css?v=20261104-mint1"/>
  <link rel="stylesheet" href="../assets/css/pdf-viewer.css?v=20261111-pv2"/>
  <script type="module" src="../assets/js/portal-motion.js?v=20261026-layer6"></script>
</head>
<body class="student-dashboard stage-portal">
<div class="app-layout">
  <aside class="sidebar" id="sidebar" data-portal="student" aria-label="Student portal"><script src="../assets/js/sidebar.js?v=20261111-redesign1"></script></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content" id="mainContent">
    <header class="topbar">
      <button class="topbar-toggle" id="sidebarToggle" aria-label="Toggle navigation"><svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#list"/></svg></button>
      <a class="sd-brand" href="dashboard.html" aria-label="Dashboard"><img src="../assets/brand/mark-96.png" width="36" height="36" alt=""/></a>
      <div class="topbar-breadcrumb"><span class="breadcrumb-item">Student Portal</span><span class="breadcrumb-sep">/</span><span class="breadcrumb-current">My Lessons</span></div>
      <div class="topbar-actions">
        <div style="position:relative;">
          <button class="notif-btn" id="notifBtn" aria-label="Notifications">
            <svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#bell"/></svg>
            <span class="notif-dot" style="display:none;" aria-hidden="true"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" style="display:none;">
            <div class="notif-header"><span>Notifications</span><a href="notifications.html">Mark all read</a></div>
            <div class="notif-list"></div>
            <div class="notif-footer"><a href="notifications.html">View all</a></div>
          </div>
        </div>
        <a href="settings.html" class="topbar-user" style="text-decoration:none;color:inherit;" title="Manage Account">
          <div class="avatar">MS</div>
          <div>
            <div class="topbar-user-name">Student</div>
            <div class="topbar-user-role">Student</div>
          </div>
        </a>
      </div>
    </header>

    <div class="page-content sd">
      <header class="sd-head">
        <div>
          <h1 class="sd-title">My lessons</h1>
          <p class="sd-sub" id="lessonsIntro">Study each body system at your own pace.</p>
        </div>
      </header>

      <section class="sd-block" aria-labelledby="availableModulesTitle">
        <div class="sd-stack">
          <label class="sd-search">
            <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#magnifying-glass"/></svg>
            <span class="sr-only">Search modules</span>
            <input type="search" id="lessonSearchInput" placeholder="Search modules or body systems" autocomplete="off" oninput="handleLessonSearch(this.value)">
          </label>
        </div>

        <h2 id="availableModulesTitle" class="sr-only">Modules</h2>
        <div id="lessonGrid" style="display:grid;gap:2rem"></div>
      </section>
    </div>
  </main>
</div>

<!-- Module: its lessons, one click to open each -->
<div class="modal-overlay" id="lessonModal" style="display:none;" onclick="if(event.target===this)closeModal('lessonModal')">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="lessonModalTitle">
    <div class="modal-header">
      <h3 id="lessonModalTitle">Module</h3>
      <button class="modal-close" onclick="closeModal('lessonModal')" aria-label="Close dialog"><svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#x-circle"/></svg></button>
    </div>
    <div class="modal-body" id="lessonModalBody"></div>
    <div class="modal-footer">
      <a id="lessonModalExploreBtn" href="anatomy.html" class="sd-ghost"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#cube"/></svg>View in 3D</a>
      <span class="sd-modal-spacer"></span>
      <a id="lessonModalQuizBtn" href="quiz.html" class="sd-go sd-go--light sd-go--sm">Take a quiz<span class="sd-go-disc"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261111-icons4#arrow-right"/></svg></span></a>
    </div>
  </div>
</div>

<!-- Lesson reader: a full-screen page, filled when a lesson opens -->
<div class="sd-reader" id="lessonContentViewer" role="dialog" aria-modal="true" aria-labelledby="readerTitle" hidden></div>

<script src="../assets/js/app.js?v=20261112-dialogs1"></script>
<script src="../assets/js/content-format.js?v=20261111-cf1"></script>
<script src="../assets/js/pdf-viewer.js?v=20261111-redesign1"></script>
<script src="../assets/js/lesson-reader.js?v=20261111-lr2"></script>
<script src="../assets/js/student-portal.js?v=20261112-shelf1"></script>
<script>
'use strict';
Auth.requireAuthSync('student');

let allModules = [];
let searchTerm = '';

const systemShort = name => String(name || '').replace(/\s+System$/i, '');

// ── Load modules from API ──────────────────────────────────────
async function loadLessons() {
  const grid = document.getElementById('lessonGrid');
  grid.innerHTML = '<div class="sd-loading">Loading modules…</div>';
  try {
    const res    = await fetch(`${API_BASE}/modules.php`, { credentials: 'same-origin' });
    const result = await res.json();
    if (!result.success) throw new Error(result.message || 'Modules unavailable');
    // A module without published lessons has nothing to open, so students don't see it.
    allModules = (result.data || []).filter(m => Number(m.lesson_count) > 0);
    updateSummaryMetrics();
    renderLessons();
  } catch (e) {
    grid.innerHTML = '<div class="dashboard-empty sd-error" role="status">We couldn’t load your lessons. Please refresh to try again.</div>';
  }
}

// ── Intro line ─────────────────────────────────────────────────
function updateSummaryMetrics() {
  const totalLessons = allModules.reduce((n, m) => n + (Number(m.lesson_count) || 0), 0);
  document.getElementById('lessonsIntro').textContent = totalLessons === 0 ? 'Lessons appear here when your teacher publishes them.'
    : `${plural(totalLessons, 'lesson')} in ${plural(allModules.length, 'module')}. Study each body system at your own pace.`;
}

// ── Render module cards ────────────────────────────────────────
function renderLessons() {
  let data = [...allModules];

  if (searchTerm) {
    data = data.filter(m =>
      (m.title && m.title.toLowerCase().includes(searchTerm)) ||
      (m.system_name && m.system_name.toLowerCase().includes(searchTerm)) ||
      (m.description && m.description.toLowerCase().includes(searchTerm))
    );
  }
  const grid = document.getElementById('lessonGrid');
  if (!data.length) {
    grid.innerHTML = allModules.length
      ? `<div class="sd-empty"><p class="sd-empty-title">No modules match</p><p>Try another word or clear your search.</p><button type="button" class="sd-ghost" onclick="resetFilters()">Clear search</button></div>`
      : `<div class="sd-empty"><p class="sd-empty-title">Your lessons are on the way</p><p>Your teacher hasn’t published any lessons yet. While you wait, explore the body in 3D.</p><a class="sd-ghost" href="anatomy.html">Explore 3D Anatomy</a></div>`;
    return;
  }

  // The API returns modules in body-system order, so each run of one system becomes its own section.
  const groups = [];
  data.forEach(m => {
    const last = groups[groups.length - 1];
    if (last && last.code === m.system_code) last.modules.push(m);
    else groups.push({ code: m.system_code, name: systemShort(m.system_name) || 'Other', modules: [m] });
  });
  grid.innerHTML = groups.map(g => `
    <section aria-label="${escHtml(g.name)}">
      <div class="sd-h"><h3 class="sd-h-title">${escHtml(g.name)}</h3><span class="sd-count">${plural(g.modules.length, 'module')}</span></div>
      <div class="sd-grid">${g.modules.map(moduleCard).join('')}</div>
    </section>`).join('');
}

function moduleCard(m) {
    const look = systemLook(m.system_code);
    const lessons = Number(m.lesson_count) || 0;
    return `
      <article class="sd-mod" style="--card:${look.colour}">
        <div class="sd-mod-art">
          ${look.art ? `<img src="${look.art}" alt="" loading="lazy" width="560" height="640">` : `<span class="sd-sys-icon">${icon('book-open')}</span>`}
        </div>
        <div class="sd-mod-body">
          <h4 class="sd-mod-title">${escHtml(m.title)}</h4>
          ${m.description ? `<p class="sd-mod-desc">${escHtml(m.description)}</p>` : ''}
          <div class="sd-mod-foot">
            <span class="sd-mod-count">${plural(lessons, 'lesson')}</span>
            <button type="button" class="sd-go sd-go--light sd-go--sm sd-stretch" onclick="viewModule(${m.module_id})">Open<span class="sr-only"> ${escHtml(m.title)}</span><span class="sd-go-disc">${icon('arrow-right')}</span></button>
          </div>
        </div>
      </article>`;
}

// ── Filter & Search Handlers ───────────────────────────────────
function handleLessonSearch(q) {
  searchTerm = q.trim().toLowerCase();
  renderLessons();
}

function resetFilters() {
  searchTerm = '';
  document.getElementById('lessonSearchInput').value = '';
  renderLessons();
}

// ── View module detail + lessons ───────────────────────────────
async function viewModule(moduleId) {
  const module = allModules.find(m => m.module_id === moduleId);
  if (!module) return;

  const body = document.getElementById('lessonModalBody');
  document.getElementById('lessonModalTitle').textContent = module.title;
  body.innerHTML = '<div class="sd-loading">Loading lessons…</div>';
  document.getElementById('lessonModalExploreBtn').href = `anatomy.html?system=${encodeURIComponent(module.system_code || '')}`;
  document.getElementById('lessonModalQuizBtn').href = `quiz.html?system=${encodeURIComponent(module.system_code || '')}`;
  openModal('lessonModal');

  try {
    const [result, filesResult] = await Promise.all([
      fetch(`${API_BASE}/lessons.php?module_id=${moduleId}`, { credentials: 'same-origin' }).then(r => r.json()),
      fetch(`${API_BASE}/files.php?kind=material&module_id=${moduleId}`, { credentials: 'same-origin' }).then(r => r.json()).catch(() => null),
    ]);
    const lessons = result.success ? result.data : [];
    const materials = filesResult?.success ? filesResult.data : [];

    body.innerHTML = `
      <div class="sd-modsum" style="--card:${systemLook(module.system_code).colour}">
        ${module.description ? `<p>${escHtml(module.description)}</p>` : ''}
        <div class="sd-mod-foot"><span class="sd-mod-count">${escHtml(module.system_name || '')} · ${plural(lessons.length, 'lesson')}</span></div>
      </div>
      <div class="sd-lessons">
        ${lessons.length ? lessons.map((l, i) => {
          const meta = [l.duration_mins ? l.duration_mins + ' min' : 'Self-paced', l.lesson_type ? l.lesson_type.replace('_', ' ') : 'Theory'].join(' · ');
          return `
            <button type="button" class="sd-lesson" onclick="startLesson(${l.lesson_id})">
              <span class="sd-lesson-num">${i + 1}</span>
              <span class="sd-lesson-copy"><span class="sd-lesson-title">${escHtml(l.title)}</span><span class="sd-lesson-meta">${escHtml(meta)}</span></span>
              <span class="sd-lesson-go">Open${icon('arrow-right')}</span>
            </button>`;
        }).join('') : '<div class="dashboard-empty">This module has no lessons yet.</div>'}
      </div>
      ${materials.length ? `<h4 class="sd-materials-title">Materials</h4><div class="sd-lessons">${materials.map(f => {
        const isPdf = f.original_name.toLowerCase().endsWith('.pdf');
        return `<${isPdf ? `button type="button" data-material="${Number(f.file_id)}" data-title="${escHtml(f.title)}" data-context="${escHtml(module.title)} · Materials"` : `a href="${API_BASE}/files.php?id=${Number(f.file_id)}" onclick="StudyClock.reading()" download`} class="sd-lesson">
          <span class="sd-lesson-num">${icon(isPdf ? 'file-pdf' : 'file-text')}</span>
          <span class="sd-lesson-copy"><span class="sd-lesson-title">${escHtml(f.title)}</span><span class="sd-lesson-meta">${isPdf ? 'PDF' : 'Download · ' + escHtml(f.original_name.split('.').pop().toUpperCase())}</span></span>
          <span class="sd-lesson-go">${isPdf ? 'Open' : 'Download'}${icon(isPdf ? 'arrow-right' : 'download-simple')}</span>
        </${isPdf ? 'button' : 'a'}>`;
      }).join('')}</div>` : ''}`;
  } catch (e) {
    body.innerHTML = '<div class="dashboard-empty sd-error" role="status">We couldn’t load this module’s lessons. Please try again.</div>';
  }
}

// ── Start a lesson & open reader ───────────────────────────────
async function startLesson(lessonId) {
  StudyClock.reading();
  try {
    const res    = await fetch(`${API_BASE}/lessons.php?id=${lessonId}`, { credentials: 'same-origin' });
    const result = await res.json();
    if (result.success && result.data) {
      closeModal('lessonModal');
      showLessonContent(result.data);
    } else {
      showToast('This lesson isn’t available right now.', 'warning');
    }
  } catch (e) {
    showToast('We couldn’t open the lesson. Check your connection and try again.', 'error');
  }
}

// ── Lesson reader (assets/js/lesson-reader.js) ─────────────────
const lessonReaderRoot = document.getElementById('lessonContentViewer');
const showLessonContent = lesson => LessonReader.show(lessonReaderRoot, lesson);
const closeLessonViewer = () => LessonReader.close(lessonReaderRoot);
// Material PDFs open in the in-app viewer; Word and PowerPoint files stay plain downloads.
document.getElementById('lessonModalBody').addEventListener('click', e => {
  const item = e.target.closest('[data-material]');
  if (item) PdfViewer.open({ url: `${API_BASE}/files.php?id=${item.dataset.material}`, title: item.dataset.title, context: item.dataset.context });
});

// ── Init ───────────────────────────────────────────────────────
loadLessons();
</script>
<script src="../assets/js/site-config.js"></script>
</body>
</html>
