<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Anatomy Explorer | Anthropotomy</title>
  <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48"/>
  <meta name="theme-color" content="#121212"/>
  <link rel="preload" href="../assets/fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="../assets/fonts/plus-jakarta-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="../assets/css/global.css?v=20261012-buttons1"/>
  <link rel="stylesheet" href="../assets/css/sidebar.css?v=20261005-brand1"/>
  <link rel="stylesheet" href="../assets/css/content.css"/>
  <!-- Three.js WebGL Libraries (Local with CDN fallback) -->
  <script src="../assets/vendor/three/three.min.js"></script>
  <script src="../assets/vendor/three/OrbitControls.js"></script>
  <script src="../assets/vendor/three/GLTFLoader.js"></script>
  <script src="../assets/vendor/three/DRACOLoader.js"></script>
  <link rel="stylesheet" href="../assets/css/student-portal.css?v=20261019-acct1"/>
  <link rel="stylesheet" href="../assets/css/explorer.css?v=20261008-collapse1"/>
  <link rel="stylesheet" href="../assets/css/stage-portal.css?v=20261021-tabs1"/>
</head>
<body class="explorer-page student-dashboard stage-portal" data-anatomy-role="student">
<div class="app-layout">

  <!-- Student Sidebar -->
  <aside class="sidebar" id="sidebar" data-portal="student" aria-label="Student portal"><script src="../assets/js/sidebar.js?v=20261021-tabs1"></script></aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content" id="mainContent">
    <header class="topbar">
      <button class="topbar-toggle" id="sidebarToggle" aria-label="Toggle navigation"><svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#list"/></svg></button>
      <a class="sd-brand" href="../index.html" aria-label="Anthropotomy home"><img src="../assets/brand/mark-96.png" width="36" height="36" alt=""/></a>
      <div class="topbar-breadcrumb">
        <span class="breadcrumb-item">Student Portal</span><span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">3D Anatomy Explorer</span>
      </div>
      <div class="topbar-actions">
        <div style="position:relative;">
          <button class="notif-btn" id="notifBtn" aria-label="Notifications">
            <svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../assets/icons/interface.svg?v=20261012-icons3#bell"/></svg>
            <span class="notif-dot" style="display:none;" aria-hidden="true"></span>
          </button>
          <div class="notif-dropdown" id="notifDropdown" style="display:none;">
            <div class="notif-header"><span>Notifications</span><a href="notifications.html">Mark all read</a></div>
            <div class="notif-list"></div>
            <div class="notif-footer"><a href="notifications.html">View all notifications</a></div>
          </div>
        </div>
        <a href="settings.html" class="topbar-user" style="text-decoration:none;color:inherit;" title="Manage Account">
          <div class="avatar">MS</div>
          <div>
            <div class="topbar-user-name">Student</div>
            <div class="topbar-user-role">Student</div>
          </div>
        </a>
      </div>
    </header>

    <section class="explorer" id="explorer" aria-labelledby="explorerTitle">
      <h1 id="explorerTitle" class="visually-hidden">3D Anatomy Explorer</h1>
      <canvas id="anatomyCanvas" class="viewer__canvas" tabindex="0" aria-label="Interactive anatomy model. Scroll to zoom at the pointer. Drag to rotate; right-drag or use arrow keys to pan. On touch screens, pinch and move two fingers to zoom and pan."></canvas>

      <div class="systems-menu" id="systemsMenu">
        <button type="button" class="systems-menu__toggle" id="systemsToggle" aria-expanded="true" aria-controls="systemChips">
          <span>Body systems</span><span class="systems-menu__count" id="systemsCount"></span><span class="systems-menu__chevron" aria-hidden="true"></span>
        </button>
        <div class="systems-menu__body">
          <div class="systems-menu__list" id="systemChips" role="group" aria-label="Body systems">Loading…</div>
        </div>
      </div>

      <div class="viewer__state" id="viewerState" role="status"></div>

      <div class="toolbar" role="toolbar" aria-label="3D viewer controls" aria-orientation="vertical">
        <button type="button" class="tool-btn" data-action="zoom-in" aria-label="Zoom in" data-tip="Zoom in (+)"></button>
        <button type="button" class="tool-btn" data-action="zoom-out" aria-label="Zoom out" data-tip="Zoom out (-)"></button>
        <button type="button" class="tool-btn" data-action="reset" aria-label="Reset view" data-tip="Reset view (R)"></button>
        <button type="button" class="tool-btn" data-action="rotate" aria-label="Auto rotate" aria-pressed="false" data-tip="Auto rotate (A)"></button>
        <button type="button" class="tool-btn" data-action="save" aria-label="Save image" data-tip="Save image (S)"></button>
        <span class="toolbar__divider" aria-hidden="true"></span>
        <button type="button" class="tool-btn" data-action="fullscreen" aria-label="Fullscreen" data-tip="Fullscreen (F)"></button>
        <button type="button" class="tool-btn" data-action="info" aria-label="Toggle info panel" aria-expanded="true" aria-controls="infoPanel" data-tip="Info (I)"></button>
      </div>

      <aside class="info-panel" id="infoPanel" aria-label="System information">
        <header class="info-panel__header">
          <div><h2 id="sysName">3D Anatomy Explorer</h2><p id="sysSummary" hidden></p></div>
          <button type="button" class="tool-btn tool-btn--sm" data-action="info-close" aria-label="Close info panel"></button>
        </header>
        <div class="info-panel__body" id="infoBody"></div>
      </aside>

      <p class="visually-hidden" id="explorerLive" aria-live="polite"></p>
    </section>
  </main>
</div>

<script src="../assets/js/app.js?v=20261019-acct1"></script>
<script src="../assets/js/student-portal.js?v=20261019-acct1"></script>
<script src="../assets/js/anatomy.js"></script>
<script src="../assets/js/anatomy-layers-core.js?v=20261011-female1"></script>
<script src="../assets/js/model-viewer.js?v=20261016-stage3"></script>
<script type="module" src="../assets/js/explorer/main.js?v=20261014-school1"></script>
<script src="../assets/js/site-config.js"></script>
</body>
</html>
